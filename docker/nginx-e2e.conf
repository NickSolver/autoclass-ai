server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;
    # Должен быть не меньше лимита файла звонка (config/calls.php) плюс поля формы.
    client_max_body_size 110M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        # Имя сервиса резолвится при каждом запросе (DNS Docker): после пересоздания контейнера
        # с PHP у него новый IP, а адрес, запомненный при старте nginx, давал бы 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app-e2e:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
